version: 2

project_name: eo

before:
  hooks:
    - go mod tidy

builds:
  - id: eo
    main: ./cmd/eo
    binary: eo
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

homebrew_casks:
  - name: eo
    binaries:
      - eo
    homepage: https://github.com/evangelischeomroep/eo-cli
    description: Developer CLI for Evangelische Omroep
    dependencies:
      - formula: azure-cli
    generate_completions_from_executable:
      executable: eo
      args:
        - completion
      shells:
        - bash
        - fish
        - zsh
    # GoReleaser can't emit the modern `postflight_steps` stanza yet
    # (goreleaser/goreleaser#6873), and the old `postflight` block it does
    # emit is deprecated on current Homebrew, so it's written by hand here
    # via custom_block instead. `chdir: "."` resolves to the staged path.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-d", "com.apple.quarantine", "eo"], chdir: "."
        end
      end
    skip_upload: auto
    repository:
      owner: evangelischeomroep
      name: eo-cli
      token: "{{ .Env.GITHUB_TOKEN }}"
      # The default branch is protected by a ruleset requiring PRs, so push
      # the cask update to its own branch and open a PR instead of pushing
      # straight to main.
      pull_request:
        enabled: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^chore:"
      - "^ci:"
      - "^docs:"

release:
  github:
    owner: evangelischeomroep
    name: eo-cli
  name_template: "v{{ .Version }}"
