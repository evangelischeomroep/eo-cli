version: 2

project_name: eo

before:
  hooks:
    - go mod tidy -diff

builds:
  - id: eo
    main: ./cmd/eo
    binary: eo
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

homebrew_casks:
  - name: eo
    binaries:
      - eo
    homepage: https://github.com/evangelischeomroep/eo-cli
    description: Developer CLI for Evangelische Omroep
    dependencies:
      - formula: azure-cli
    generate_completions_from_executable:
      executable: eo
      args:
        - completion
      shells:
        - bash
        - fish
        - zsh
    url:
      using: EoReleaseDownloadStrategy
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-d", "com.apple.quarantine", "eo"], chdir: "."
          end
    custom_block: |
      require "download_strategy"

      class EoReleaseDownloadStrategy < CurlDownloadStrategy
        def initialize(url, name, version, **meta)
          @github_token = GitHub::API.credentials
          if @github_token
            match = %r{\Ahttps://github\.com/evangelischeomroep/eo-cli/releases/download/([^/]+)/([^/]+)\z}.match(url)
            raise CurlDownloadStrategyError.new(url, "Unexpected eo release URL.") unless match

            tag, filename = match.captures
            asset = GitHub.get_release("evangelischeomroep", "eo-cli", tag).fetch("assets").find do |entry|
              entry.fetch("name") == filename
            end
            raise CurlDownloadStrategyError.new(url, "Release asset not found.") unless asset

            url = "https://api.github.com/repos/evangelischeomroep/eo-cli/releases/assets/#{Integer(asset.fetch("id"))}"
            meta[:headers] = [
              *meta[:headers],
              "Accept: application/octet-stream",
              "Authorization: Bearer #{@github_token}",
            ]
          end
          super(url, name, version, **meta)
        end

        def curl(*args, secrets: [], **options)
          super(*args, secrets: [*secrets, @github_token].compact, **options)
        end

        def curl_headers(*args, secrets: [], **options)
          super(*args, secrets: [*secrets, @github_token].compact, **options)
        end
      end

    skip_upload: auto
    repository:
      owner: evangelischeomroep
      name: eo-cli
      # GitHub Actions can push the cask branch. An EO maintainer opens the PR.
      branch: "{{ .ProjectName }}-{{ .Version }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^chore:"
      - "^ci:"
      - "^docs:"

release:
  github:
    owner: evangelischeomroep
    name: eo-cli
  name_template: "v{{ .Version }}"
