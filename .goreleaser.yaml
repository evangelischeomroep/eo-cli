version: 2

project_name: eo

before:
  hooks:
    - go mod tidy -diff

builds:
  - id: eo
    main: ./cmd/eo
    binary: eo
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

homebrew_casks:
  - name: eo
    binaries:
      - eo
    homepage: https://github.com/evangelischeomroep/eo-cli
    description: Developer CLI for Evangelische Omroep
    dependencies:
      - formula: azure-cli
    generate_completions_from_executable:
      executable: eo
      args:
        - completion
      shells:
        - bash
        - fish
        - zsh
    url:
      using: EoReleaseDownloadStrategy
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-d", "com.apple.quarantine", "eo"], chdir: "."
          end
    custom_block: |
      require "download_strategy"

      class EoReleaseDownloadStrategy < CurlDownloadStrategy
        def initialize(url, name, version, **meta)
          @github_token = GitHub::API.credentials
          if @github_token
            match = %r{\Ahttps://github\.com/evangelischeomroep/eo-cli/releases/download/([^/]+)/([^/]+)\z}.match(url)
            raise CurlDownloadStrategyError.new(url, "Unexpected eo release URL.") unless match

            tag, filename = match.captures
            if (release = accessible_release(tag))
              asset = release.fetch("assets").find { |entry| entry.fetch("name") == filename }
              raise CurlDownloadStrategyError.new(url, "Release asset not found.") unless asset

              url = "https://api.github.com/repos/evangelischeomroep/eo-cli/releases/assets/#{Integer(asset.fetch("id"))}"
              meta[:headers] = [
                *meta[:headers],
                "Accept: application/octet-stream",
                "Authorization: Bearer #{@github_token}",
              ]
            end
          end
          super(url, name, version, **meta)
        end

        def fetch(timeout: nil)
          super
        rescue CurlDownloadStrategyError, ErrorDuringExecution => error
          raise if @github_token

          raise CurlDownloadStrategyError.new(
            url, "#{error.message}\nFor a private EO release, run gh auth login with an account that can read eo-cli. " \
                 "If HOMEBREW_GITHUB_API_TOKEN is set, unset it or replace it with a token that can read eo-cli."
          )
        end

        def curl(*args, secrets: [], **options)
          super(*args, secrets: [*secrets, @github_token].compact, **options)
        end

        def curl_headers(*args, secrets: [], **options)
          super(*args, secrets: [*secrets, @github_token].compact, **options)
        end

        private

        def accessible_release(tag)
          GitHub.get_release("evangelischeomroep", "eo-cli", tag)
        rescue GitHub::API::AuthenticationFailedError, GitHub::API::HTTPNotFoundError
          # A public release can still be fetched without the rejected credential.
          @github_token = nil
        end
      end

    skip_upload: true
    repository:
      owner: evangelischeomroep
      name: eo-cli

changelog:
  sort: asc
  filters:
    exclude:
      - "^chore:"
      - "^ci:"
      - "^docs:"

release:
  github:
    owner: evangelischeomroep
    name: eo-cli
  name_template: "v{{ .Version }}"
  use_existing_draft: true
  replace_existing_artifacts: true
  make_latest: "legacy"
  extra_files:
    - glob: dist/homebrew/Casks/eo.rb
